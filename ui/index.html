<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/shell.css" />
    <link rel="stylesheet" href="/src/styles/content.css" />
    <link rel="stylesheet" href="/src/styles/scan.css" />
    <link rel="stylesheet" href="/src/styles/scan_result.css" />
    <link rel="stylesheet" href="/src/styles/overview.css" />
    <link rel="stylesheet" href="/src/styles/overview_chart.css" />
    <link rel="stylesheet" href="/src/styles/print.css" />
    <link rel="stylesheet" href="/src/styles/settings.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>prindeck — скан</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-scan" viewBox="0 0 24 24">
        <path d="M3 7V5a2 2 0 0 1 2-2h2" />
        <path d="M17 3h2a2 2 0 0 1 2 2v2" />
        <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
        <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
        <path d="M7 12h10" />
      </symbol>
      <symbol id="i-gauge" viewBox="0 0 24 24">
        <path d="m12 14 4-4" />
        <path d="M3.34 19a10 10 0 1 1 17.32 0" />
      </symbol>
      <symbol id="i-printer" viewBox="0 0 24 24">
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
        <path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6" />
        <rect x="6" y="14" width="12" height="8" rx="1" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4" />
      </symbol>
    </svg>

    <div id="shell">
      <nav class="sidebar" aria-label="Навигация">
        <p class="app-name">prindeck</p>

        <div id="device-status" class="device-status">
          <span class="device-status-dot" data-tone="idle" aria-hidden="true"></span>
          <p id="device-model" class="device-status-model"></p>
        </div>

        <ul class="nav-list">
          <li>
            <button class="nav-item" type="button" data-nav="scan" title="Скан" aria-label="Скан" aria-current="page">
              <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <use href="#i-scan" />
              </svg>
              <span class="nav-label">Скан</span>
            </button>
          </li>
          <li>
            <button class="nav-item" type="button" data-nav="overview" title="Обзор" aria-label="Обзор" tabindex="-1">
              <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <use href="#i-gauge" />
              </svg>
              <span class="nav-label">Обзор</span>
            </button>
          </li>
          <li>
            <button class="nav-item" type="button" data-nav="print" title="Печать" aria-label="Печать" tabindex="-1">
              <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <use href="#i-printer" />
              </svg>
              <span class="nav-label">Печать</span>
            </button>
          </li>
          <li>
            <button class="nav-item" type="button" data-nav="settings" title="Настройки" aria-label="Настройки" tabindex="-1">
              <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <use href="#i-settings" />
              </svg>
              <span class="nav-label">Настройки</span>
            </button>
          </li>
        </ul>
      </nav>

      <main class="content">
        <header class="content-header">
          <h1 id="screen-title" class="screen-title" tabindex="-1">Скан</h1>
          <p
            id="status"
            class="status"
            role="status"
            aria-live="polite"
            data-tone="idle"
          ></p>
        </header>

        <div id="startup-banner" class="banner banner--warn" role="status" hidden>
          <div class="banner-body">
            <p class="banner-title">Проблема с конфигурацией</p>
            <p id="startup-banner-text" class="banner-text"></p>
          </div>
        </div>

        <div id="caps-banner" class="banner banner--error" role="alert" hidden>
          <div class="banner-body">
            <p class="banner-title">Устройство недоступно</p>
            <p id="caps-banner-text" class="banner-text"></p>
          </div>
          <button id="caps-retry" class="button button--ghost" type="button">
            Повторить
          </button>
        </div>

        <div id="conn-banner" class="banner banner--error" role="status" aria-live="polite" hidden>
          <div class="banner-body">
            <p class="banner-title">Нет связи с устройством</p>
            <p id="conn-banner-text" class="banner-text">
              Не удаётся получить состояние устройства, сканирование
              недоступно.
            </p>
          </div>
          <button id="conn-retry" class="button button--ghost" type="button">
            Повторить
          </button>
        </div>

        <section data-screen="scan" class="screen">
          <form id="scan-form" class="panel" novalidate>
            <div class="fields">
              <label class="field">
                <span class="field-label">Источник</span>
                <select id="source" class="select"></select>
              </label>
              <label class="field">
                <span class="field-label">Разрешение</span>
                <select id="dpi" class="select"></select>
              </label>
              <label class="field">
                <span class="field-label">Цвет</span>
                <select id="color" class="select"></select>
              </label>
              <label class="field">
                <span class="field-label">Формат</span>
                <select id="format" class="select"></select>
              </label>
            </div>

            <p id="format-hint" class="hint" hidden></p>

            <div class="actions">
              <button id="start" class="button button--primary" type="submit">
                Сканировать
              </button>
              <button
                id="cancel"
                class="button button--secondary"
                type="button"
                hidden
              >
                Отмена
              </button>
            </div>
          </form>

          <section id="scan-progress" class="scan-progress" hidden>
            <p id="pages-counter" class="scan-counter"></p>
            <p id="scan-elapsed" class="scan-elapsed"></p>
            <ul id="page-list" class="page-list" hidden></ul>
          </section>

          <section id="result" class="result" hidden>
            <h2 id="result-title" class="result-title">Файл готов</h2>
            <p id="result-partial" class="result-partial" hidden></p>
            <p id="result-warning" class="result-warning" hidden></p>
            <ul id="result-files" class="result-files" hidden></ul>
            <button id="open-folder" class="button button--secondary" type="button">
              Открыть папку
            </button>
          </section>
        </section>

        <section data-screen="overview" class="screen" hidden>
          <div id="overview-connection-mount" class="overview-mount"></div>
          <div id="overview-supplies-mount" class="overview-mount"></div>
          <div id="overview-chart-mount" class="overview-mount"></div>
          <div id="overview-actions-mount" class="overview-mount"></div>
        </section>

        <section data-screen="print" class="screen" hidden>
          <div id="print-form-mount"></div>
          <div id="print-queue-mount"></div>
        </section>

        <section data-screen="settings" class="screen" hidden>
          <div id="settings-form-mount"></div>
          <div id="settings-links-mount"></div>
        </section>
      </main>
    </div>
  </body>
</html>
